name: Build SysFlow for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout SysFlow
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 psutil pyinstaller

      - name: Build SysFlow
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name SysFlow `
            app.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SysFlow-Windows
          path: dist/SysFlow/
